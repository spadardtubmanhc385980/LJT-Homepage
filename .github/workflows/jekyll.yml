name: Deploy personal site to GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - '_data/navigation.yml'
      - '_pages/**'
      - '_publications/**'
      - '_config.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Remove demonstration files from the repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          base = 'https://api.github.com/repos/' + repository
          headers = {
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              retry = 0
              while True:
                  http_request = urllib.request.Request(url, data=body, headers=headers, method=method)
                  try:
                      response = urllib.request.urlopen(http_request)
                  except urllib.error.HTTPError as error:
                      if error.code < 500 and error.code not in (403, 409, 429):
                          raise
                      retry += 1
                      if retry > 4:
                          raise
                      delay = 2 ** retry
                  else:
                      if body is None:
                          return json.load(response)
                      response.read()
                      return
                  time.sleep(delay)

          def is_demo(path):
              if path in ('_data/authors.yml', '_data/comments', 'talkmap.py', 'talkmap.ipynb', 'talkmap_out.ipynb'):
                  return True
              root = path.split('/', 1)[0]
              if root in ('_drafts', '_posts', '_talks', '_teaching', '_portfolio', 'files', 'markdown_generator', 'talkmap'):
                  return True
              if root == '_pages' and path.rsplit('/', 1)[-1] not in ('about.md', 'cv.md', 'publications.html', '404.md'):
                  return True
              return False

          tree = request('GET', base + '/git/trees/master?recursive=1')
          removals = []
          if tree.get('path') and is_demo(tree['path']):
              removals.append(tree['path'])
          removals.extend(item['path'] for item in tree.get('tree', []) if item['type'] == 'blob' and is_demo(item['path']))

          for path in removals:
              had_error = False
              for _ in range(6):
                  quoted = urllib.parse.quote(path, safe='')
                  try:
                      blob = request('GET', base + '/contents/' + quoted)
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          had_error = False
                          break
                      had_error = True
                      time.sleep(2)
                  else:
                      had_error = False
                      request('DELETE', base + '/contents/' + quoted, {
                          'sha': blob['sha'],
                          'message': 'Remove AcademicPages demonstration content',
                          'branch': 'master',
                      })
                      break
              if had_error:
                  raise RuntimeError('Could not remove demonstration file: ' + path)
          print('Removed ' + str(len(removals)) + ' demonstration file(s).')
          EOF

  build:
    if: always() && (needs.clean.result == 'success' || needs.clean.result == 'skipped')
    needs: clean
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Remove any remaining example content from the published site
        run: |
          rm -rf _drafts _posts _talks _teaching _portfolio files markdown_generator talkmap
          rm -f talkmap.py talkmap.ipynb talkmap_out.ipynb _data/authors.yml
          find _pages -type f ! -name about.md ! -name cv.md ! -name publications.html ! -name 404.md -delete

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install UglifyJS
        run: npm install -g uglify-js

      - name: Prepare JavaScript
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl '/LJT-Homepage'
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  publish:
    # This repository's workflow token cannot create a Pages site via the Pages
    # API, so deploy the same Jekyll artifact to the standard GitHub Pages branch.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Publish generated site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 << 'EOF'
          import base64
          import hashlib
          import io
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          import zipfile

          repository = os.environ['GITHUB_REPOSITORY']
          api = 'https://api.github.com/repos/' + repository
          headers = {
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              retry = 0
              while True:
                  req = urllib.request.Request(url, data=body, headers=headers, method=method)
                  try:
                      response = urllib.request.urlopen(req)
                  except urllib.error.HTTPError as error:
                      if error.code < 500 and error.code not in (403, 409, 429):
                          raise RuntimeError('HTTP ' + str(error.code) + ': ' + error.read().decode())
                      retry += 1
                      if retry > 4:
                          raise RuntimeError('HTTP ' + str(error.code) + ': ' + error.read().decode())
                      delay = 2 ** retry
                  else:
                      result = response.read()
                      response.close()
                      if body is None:
                          return json.loads(result) if result else None
                      return
                  time.sleep(delay)

          artifacts = request('GET', api + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts')
          artifact = next(item for item in artifacts['artifacts'] if item['name'] == 'github-pages' and not item['expired'])
          archive = request('GET', artifact['archive_download_url'])
          files = {}
          with zipfile.ZipFile(io.BytesIO(archive)) as archive_file:
              for item in archive_file.infolist():
                  if not item.is_dir():
                      if not item.filename.startswith('_site/'):
                          raise RuntimeError('Unexpected generated file path: ' + item.filename)
                      files[item.filename[len('_site/'):]] = archive_file.read(item)

          tree_entries = []
          for path, content in sorted(files.items()):
              digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request('POST', api + '/git/blobs', {
                  'content': base64.b64encode(content).decode(),
                  'encoding': 'base64',
              })
              tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': digest})

          tree = request('POST', api + '/git/trees', {'tree': tree_entries})
          try:
              previous = request('GET', api + '/git/refs/heads/gh-pages')
              parent = previous['object']['sha']
          except RuntimeError as error:
              if 'HTTP 404:' not in str(error):
                  raise
              parent = None

          commit = request('POST', api + '/git/commits', {
              'tree': tree['sha'],
              'message': 'Deploy personal homepage',
              **({'parents': [parent]} if parent is not None else {}),
          })
          ref = 'refs/heads/gh-pages'
          if parent is None:
              request('POST', api + '/git/refs', {'ref': ref, 'sha': commit['sha']})
          else:
              request('PATCH', api + '/git/refs/heads/gh-pages', {'sha': commit['sha'], 'force': True})

          print('Published ' + str(len(files)) + ' generated file(s) to gh-pages.')
          EOF
