name: Check personal site URLs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check published pages
        run: |
          python3 << 'EOF'
          import json
          import time
          import urllib.error
          import urllib.request

          urls = [
              'https://spadardtubmanhc385980.github.io/LJT-Homepage/',
              'https://spadardtubmanhc385980.github.io/LJT-Homepage/publications/',
              'https://spadardtubmanhc385980.github.io/LJT-Homepage/cv/',
          ]
          expected = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]

          for url in urls:
              for attempt in range(20):
                  try:
                      response = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'personal-site-verification'}), timeout=15)
                      html = response.read().decode('utf-8')
                      status = response.status
                  except urllib.error.HTTPError as error:
                      status = error.code
                      html = ''
                  if status == 200:
                      print(url)
                      print('HTTP status: ' + str(status))
                      print('All six publications present: ' + str(all(title in html for title in expected)))
                      print('No demonstration publication present: ' + str('Paper Title Number' not in html))
                      print('Profile name present: ' + str('Junteng Liu' in html))
                      print('Research experience present: ' + str('Research Experience' in html))
                      print('Contact information present: ' + str('jliugi@connect.ust.hk' in html))
                      break
                  time.sleep(3)
              else:
                  raise RuntimeError('Published page unavailable: ' + url + ' (HTTP ' + str(status) + ')')
          EOF
